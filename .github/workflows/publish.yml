name: Publish

# Tag push (npm version <bump> && git push --follow-tags) publishes to
# GitHub Packages with the workflow's own GITHUB_TOKEN, no personal token.
# GitHub Packages does not support npm provenance.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
      - run: bun install --frozen-lockfile
        env:
          RUNMIST_PKG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run knip
      - run: bun run test
      - run: bun run build
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNMIST_PKG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
